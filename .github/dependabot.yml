version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Warsaw
    labels:
      - dependencies
      - automated
    open-pull-requests-limit: 10
    groups:
      supabase:
        patterns:
          - "@supabase/*"
      tanstack:
        patterns:
          - "@tanstack/*"
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
          - "typescript-eslint"
      devDependencies:
        dependency-type: development
        exclude-patterns:
          - "@typescript-eslint/*"
          - "typescript-eslint"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Warsaw
    labels:
      - dependencies
      - automated
      - ci
